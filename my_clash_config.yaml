# ---------------------------------------------------
# 基础配置
# ---------------------------------------------------
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ---------------------------------------------------
# 1. 你的 VLESS 节点信息（请根据实际情况修改）
# ---------------------------------------------------
proxies:
  - name: "我的自建VLESS"
    type: vless
    server: 你的服务器IP或域名
    port: 443
    uuid: 你的UUID
    udp: true
    tls: true
    network: ws # 如果是 grpc 或 tcp，请修改
    servername: 你的域名(SNI)
    ws-opts:
      path: "/你的路径"

# ---------------------------------------------------
# 2. 策略组（模仿 Mannix 配置的分组）
# ---------------------------------------------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 我的自建VLESS
      - DIRECT

  - name: 📺 视频广告
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - 我的自建VLESS

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

# ---------------------------------------------------
# 3. 远程规则集（核心：自动同步 ACL4SSR 的规则）
# ---------------------------------------------------
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/BanAD.yaml"
    path: ./ruleset/reject.yaml
    interval: 86400

  foreign_media:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/ProxyMedia.yaml"
    path: ./ruleset/foreign_media.yaml
    interval: 86400

  apple:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Apple.yaml"
    path: ./ruleset/apple.yaml
    interval: 86400

  microsoft:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Microsoft.yaml"
    path: ./ruleset/microsoft.yaml
    interval: 86400

# ---------------------------------------------------
# 4. 路由规则
# ---------------------------------------------------
rules:
  - RULE-SET,reject,📺 视频广告
  - RULE-SET,foreign_media,🌍 国外媒体
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择